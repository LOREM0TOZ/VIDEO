<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Foundryy Promo</title>
<style>
  @font-face { font-family: "Space Grotesk"; font-weight: 500; src: url("../node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-weight: 700; src: url("../node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400; src: url("../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }

  :root { --bg:#0d0b0a; --ink:#f4ede4; --muted:#8a7f74; --molten:#ff6a1a; --hot:#ffb347; --white:#fff3d6; }
  html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:var(--bg); }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg); }
  canvas { position:absolute; inset:0; }
  .layer { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; opacity:0; }
  .serif { font-family:"Space Grotesk", sans-serif; }
  .mono { font-family:"JetBrains Mono", monospace; letter-spacing:.3em; text-transform:uppercase; }

  #s1 h1 { font-family:"Space Grotesk"; font-weight:500; font-size:76px; color:var(--ink); margin:0; letter-spacing:-.01em; }
  #s1 .word { display:inline-block; }

  #s2 { flex-direction:row; gap:70px; }
  #s2 .raw { font-family:"Space Grotesk"; font-weight:700; font-size:150px; color:var(--ink); letter-spacing:-.04em; }

  #s3 .kick { font-size:22px; color:var(--molten); margin-bottom:28px; }
  #s3 h2 { font-family:"Space Grotesk"; font-weight:700; font-size:104px; margin:0; letter-spacing:-.03em;
           background:linear-gradient(90deg,var(--hot),var(--molten) 50%,var(--ink) 50%); background-size:200% 100%;
           -webkit-background-clip:text; background-clip:text; color:transparent; }

  #s4 .cards { display:flex; gap:40px; }
  #s4 .card { width:440px; height:380px; box-sizing:border-box; padding:44px; border-radius:22px;
              background:linear-gradient(160deg,#1c1714,#120f0d); border:1px solid #3a2b20; position:relative; overflow:hidden; }
  #s4 .card .k { font-family:"JetBrains Mono"; font-size:22px; color:var(--molten); letter-spacing:.2em; }
  #s4 .card .t { font-family:"Space Grotesk"; font-weight:700; font-size:72px; color:var(--ink); margin-top:120px; letter-spacing:-.03em; }
  #s4 .card .b { font-family:"Inter"; font-size:28px; color:var(--muted); margin-top:10px; }
  #s4 .card .glow { position:absolute; left:0; right:0; bottom:0; height:6px; background:linear-gradient(90deg,var(--molten),var(--hot)); transform-origin:left; }

  #s5 .logo { display:flex; align-items:center; gap:36px; }
  #s5 .mark { width:150px; height:150px; }
  #s5 .name { font-family:"Space Grotesk"; font-weight:700; font-size:150px; letter-spacing:-.04em;
              background:linear-gradient(180deg,var(--white) 0%,var(--hot) 45%,var(--molten) 100%);
              -webkit-background-clip:text; background-clip:text; color:transparent; }
  #s5 .tag { font-family:"Inter"; font-size:40px; color:var(--ink); margin-top:28px; }
  #s5 .cta { margin-top:70px; display:flex; align-items:center; gap:28px; }
  #s5 .btn { font-family:"Space Grotesk"; font-weight:700; font-size:32px; color:#1a0d05; background:linear-gradient(90deg,var(--hot),var(--molten));
             padding:22px 44px; border-radius:999px; }
  #s5 .url { font-family:"JetBrains Mono"; font-size:30px; color:var(--muted); letter-spacing:.1em; }

  #vignette { position:absolute; inset:0; pointer-events:none;
              background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.75) 100%); }
  #grain { position:absolute; inset:0; pointer-events:none; opacity:.06; mix-blend-mode:overlay; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>

  <div class="layer" id="s1"><h1 id="opener"></h1></div>
  <div class="layer" id="s2"></div>
  <div class="layer" id="s3"><div class="kick mono">The Foundry</div><h2 id="forge"></h2></div>
  <div class="layer" id="s4"><div class="cards" id="cards"></div></div>
  <div class="layer" id="s5">
    <div class="logo">
      <svg class="mark" viewBox="0 0 100 100" id="mark">
        <defs>
          <linearGradient id="mg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff3d6"/><stop offset=".45" stop-color="#ffb347"/><stop offset="1" stop-color="#ff6a1a"/>
          </linearGradient>
        </defs>
        <!-- crucible / anvil "F" mark -->
        <path id="markPath" d="M18 14 H82 L74 32 H40 V44 H66 L60 60 H40 V86 H18 Z" fill="none" stroke="url(#mg)" stroke-width="5" stroke-linejoin="round"/>
        <path id="markFill" d="M18 14 H82 L74 32 H40 V44 H66 L60 60 H40 V86 H18 Z" fill="url(#mg)"/>
      </svg>
      <div class="name" id="name"></div>
    </div>
    <div class="tag" id="tag"></div>
    <div class="cta"><div class="btn" id="cta"></div><div class="url" id="url"></div></div>
  </div>

  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="vignette"></div>
  <canvas id="grain" width="480" height="270" style="width:1920px;height:1080px"></canvas>
</div>

<script>
const W = 1920, H = 1080;
const DURATION = 22;
const $ = (id) => document.getElementById(id);

// ---------- easing / helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const backOut = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// fade a layer in over [a, a+fi], out over [b-fo, b]
const window_ = (t, a, b, fi = .5, fo = .5) => Math.min(prog(t, a, a + fi), 1 - prog(t, b - fo, b));
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- brand ----------
let B;
function applyBrand(brand) {
  B = brand;
  const c = brand.colors || {};
  for (const k of Object.keys(c)) document.documentElement.style.setProperty("--" + k, c[k]);
  $("opener").innerHTML = brand.opener.split(" ").map(w => `<span class="word">${w}</span>`).join(" ");
  $("s2").innerHTML = brand.rawMaterials.map(w => `<div class="raw">${w}</div>`).join("");
  $("forge").textContent = brand.forgeLine;
  $("cards").innerHTML = brand.pillars.map(p =>
    `<div class="card"><div class="k">${p.kicker}</div><div class="t">${p.title}</div><div class="b">${p.body}</div><div class="glow"></div></div>`).join("");
  $("name").textContent = brand.name;
  $("tag").textContent = brand.tagline;
  $("cta").textContent = brand.cta + "  →";
  $("url").textContent = brand.url;
  const len = $("markPath").getTotalLength();
  $("markPath").style.strokeDasharray = len;
  $("markPath").dataset.len = len;
}

// ---------- timeline ----------
// beats (seconds) where "hammer" impacts land — the audio synth uses the same list
const HITS = [3.6, 4.5, 5.4, 15.0];
const SCENES = { s1: [0.3, 3.3], s2: [3.4, 6.9], s3: [7.0, 10.6], s4: [10.7, 14.85], s5: [14.95, DURATION] };

// ---------- deterministic particles (sparks) ----------
// every spark is a closed-form function of time, so any frame can be rendered independently.
const sparks = [];
(function buildSparks() {
  const r = mulberry(7);
  // ambient embers rising across the whole piece
  for (let i = 0; i < 260; i++) {
    sparks.push({ kind: "ember", t0: r() * DURATION - 4, life: 4 + r() * 5, x: r() * W, y: H + 20,
                  vx: (r() - .5) * 40, vy: -(60 + r() * 120), g: 0, size: 1 + r() * 2.4, wob: r() * 6.28 });
  }
  // bursts on each hammer hit
  HITS.forEach((ht, hi) => {
    const n = hi === 3 ? 320 : 140;
    const cx = hi === 3 ? W / 2 : [W / 2 - 520, W / 2, W / 2 + 520][hi];
    const cy = H / 2 + (hi === 3 ? 0 : 60);
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (r() - .5) * Math.PI * (hi === 3 ? 2 : 1.4);
      const sp = 300 + r() * (hi === 3 ? 1300 : 900);
      sparks.push({ kind: "burst", t0: ht, life: .6 + r() * 1.4, x: cx + (r() - .5) * 120, y: cy,
                    vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 1400, size: 1.2 + r() * 2.2, wob: 0 });
    }
  });
})();

function drawSparks(ctx, t) {
  ctx.globalCompositeOperation = "lighter";
  for (const s of sparks) {
    const dt = t - s.t0;
    if (dt < 0 || dt > s.life) continue;
    const k = dt / s.life;
    const drag = s.kind === "burst" ? Math.exp(-dt * 1.8) : 1;
    const dist = s.kind === "burst" ? (1 - drag) / 1.8 : dt;
    const x = s.x + s.vx * dist + (s.kind === "ember" ? Math.sin(dt * 1.7 + s.wob) * 18 : 0);
    const y = s.y + s.vy * dist + .5 * s.g * dt * dt;
    const vx = s.vx * drag, vy = s.vy * drag + s.g * dt;
    const alpha = (1 - k) * (s.kind === "ember" ? .8 * Math.min(1, dt * 2) : 1);
    const heat = 1 - k;
    const col = `rgba(255,${Math.round(110 + 130 * heat)},${Math.round(40 + 120 * heat * heat)},${alpha})`;
    if (s.kind === "burst") {
      const tail = .025;
      ctx.strokeStyle = col; ctx.lineWidth = s.size; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - vx * tail, y - vy * tail); ctx.stroke();
    } else {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(x, y, s.size, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = "source-over";
}

// ---------- background: molten floor glow + heat line ----------
function drawBackground(ctx, t) {
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--bg") || "#0d0b0a";
  ctx.fillRect(0, 0, W, H);

  // breathing furnace glow from below
  const pulse = .55 + .15 * Math.sin(t * 2.1) + .25 * HITS.reduce((m, h) => Math.max(m, Math.exp(-Math.max(0, t - h) * 3) * (t >= h)), 0);
  const g = ctx.createRadialGradient(W / 2, H + 260, 40, W / 2, H + 260, 1100);
  g.addColorStop(0, `rgba(255,106,26,${.55 * pulse})`);
  g.addColorStop(.4, `rgba(180,50,10,${.22 * pulse})`);
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // faint blueprint grid that drifts (the "build" motif)
  const gridA = .05 * window_(t, 7, 16, 1, 1);
  if (gridA > 0) {
    ctx.strokeStyle = `rgba(255,179,71,${gridA})`; ctx.lineWidth = 1;
    const off = (t * 20) % 80;
    ctx.beginPath();
    for (let x = -80 + off; x < W + 80; x += 80) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = -80 + off; y < H + 80; y += 80) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
  }

  // molten line drawing across the frame in the opener
  const lp = easeInOut(prog(t, .2, 2.6));
  const la = 1 - prog(t, 3.0, 3.5);
  if (lp > 0 && la > 0) {
    const y = H / 2 + 90, x0 = W / 2 - 560, x1 = x0 + 1120 * lp;
    const lg = ctx.createLinearGradient(x0, 0, x1, 0);
    lg.addColorStop(0, "rgba(255,106,26,0)"); lg.addColorStop(.8, `rgba(255,140,40,${la})`); lg.addColorStop(1, `rgba(255,243,214,${la})`);
    ctx.strokeStyle = lg; ctx.lineWidth = 3;
    ctx.shadowColor = "#ff6a1a"; ctx.shadowBlur = 24;
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    ctx.shadowBlur = 0;
    // white-hot tip
    ctx.fillStyle = `rgba(255,243,214,${la})`; ctx.beginPath(); ctx.arc(x1, y, 5, 0, 7); ctx.fill();
  }

  // logo-scene light bloom
  const bloom = window_(t, 15.0, DURATION + 1, .3, .5);
  if (bloom > 0) {
    const flash = Math.exp(-Math.max(0, t - 15.0) * 2.5);
    const bg2 = ctx.createRadialGradient(W / 2, H / 2 - 40, 10, W / 2, H / 2 - 40, 900);
    bg2.addColorStop(0, `rgba(255,140,40,${.18 * bloom + .5 * flash})`);
    bg2.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = bg2; ctx.fillRect(0, 0, W, H);
  }
}

function drawGrain(t) {
  const c = $("grain"), ctx = c.getContext("2d");
  const img = ctx.createImageData(c.width, c.height);
  const r = mulberry(Math.floor(t * 30) + 1);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

// camera shake from hammer hits
function shake(t) {
  let a = 0;
  for (const h of HITS) if (t >= h) a += Math.exp(-(t - h) * 9) * (h === 15.0 ? 14 : 9);
  return [Math.sin(t * 93) * a, Math.cos(t * 71) * a];
}

// ---------- scenes ----------
function setLayer(id, t) {
  const [a, b] = SCENES[id];
  const o = window_(t, a, b, .45, .45);
  const el = $(id);
  el.style.opacity = o;
  el.style.visibility = o > 0 ? "visible" : "hidden";
  return o;
}

function renderFrame(t) {
  const [sx, sy] = shake(t);
  $("stage").style.transform = `translate(${sx}px,${sy}px)`;

  drawBackground($("bg").getContext("2d"), t);

  // S1 — opener, words rise in one by one
  if (setLayer("s1", t) > 0) {
    [...$("opener").children].forEach((w, i) => {
      const p = easeOut(prog(t, .4 + i * .14, 1.0 + i * .14));
      w.style.opacity = p; w.style.transform = `translateY(${(1 - p) * 40}px)`;
      w.style.filter = `blur(${(1 - p) * 8}px)`;
    });
    $("s1").style.transform = `scale(${1 + prog(t, 0, 3.3) * .04})`;
  }

  // S2 — raw materials hammered in on each hit
  if (setLayer("s2", t) > 0) {
    [...$("s2").children].forEach((w, i) => {
      const h = HITS[i];
      const p = prog(t, h - .18, h);
      const after = Math.max(0, t - h);
      const sc = t < h ? 2.6 - 1.6 * easeOut(p) : 1 + .06 * Math.exp(-after * 8) * Math.cos(after * 40);
      w.style.opacity = t < h - .18 ? 0 : 1;
      w.style.transform = `scale(${sc})`;
      const heat = Math.exp(-after * 1.6) * (t >= h);
      w.style.color = heat > .02 ? `rgb(255,${Math.round(237 - 120 * heat)},${Math.round(228 - 200 * heat)})` : "";
      w.style.textShadow = `0 0 ${40 * heat}px rgba(255,106,26,${heat})`;
    });
  }

  // S3 — forge line fills with molten gradient
  if (setLayer("s3", t) > 0) {
    const p = easeInOut(prog(t, 7.4, 9.6));
    $("forge").style.backgroundPosition = `${100 - p * 100}% 0`;
    const k = easeOut(prog(t, 7.1, 7.9));
    $("s3").style.transform = `translateY(${(1 - k) * 30}px)`;
  }

  // S4 — three pillar cards assemble
  if (setLayer("s4", t) > 0) {
    [...$("cards").children].forEach((c, i) => {
      const p = backOut(prog(t, 10.9 + i * .28, 11.7 + i * .28));
      const pe = clamp(p, 0, 1.2);
      c.style.opacity = clamp(prog(t, 10.9 + i * .28, 11.3 + i * .28));
      c.style.transform = `translateY(${(1 - pe) * 140}px) rotate(${(1 - clamp(pe)) * (i - 1) * 4}deg)`;
      c.querySelector(".glow").style.transform = `scaleX(${easeInOut(prog(t, 11.8 + i * .45, 12.8 + i * .45))})`;
      const lit = window_(t, 11.8 + i * .45, 14.85, .5, .6);
      c.style.borderColor = `rgba(255,106,26,${.2 + .5 * lit})`;
      c.style.boxShadow = `0 30px 80px rgba(255,106,26,${.15 * lit})`;
    });
    $("cards").style.transform = `scale(${1 + prog(t, 10.7, 14.85) * .05})`;
  }

  // S5 — logo lockup
  if (setLayer("s5", t) > 0) {
    const len = +$("markPath").dataset.len;
    $("markPath").style.strokeDashoffset = len * (1 - easeInOut(prog(t, 15.0, 16.0)));
    $("markFill").style.opacity = easeOut(prog(t, 15.7, 16.4));
    const np = easeOut(prog(t, 15.3, 16.3));
    $("name").style.opacity = np;
    $("name").style.letterSpacing = `${-.04 + (1 - np) * .25}em`;
    $("name").style.filter = `blur(${(1 - np) * 10}px)`;
    const tp = easeOut(prog(t, 16.4, 17.2));
    $("tag").style.opacity = tp; $("tag").style.transform = `translateY(${(1 - tp) * 20}px)`;
    const cp = backOut(prog(t, 17.2, 18.0));
    $("cta").parentElement.style.opacity = clamp(prog(t, 17.2, 17.6));
    $("cta").parentElement.style.transform = `scale(${.8 + .2 * cp})`;
    $("s5").style.transform = `scale(${1.04 - easeOut(prog(t, 14.95, DURATION)) * .04})`;
  }

  // FX layer: sparks over everything
  const fx = $("fx").getContext("2d");
  fx.clearRect(0, 0, W, H);
  drawSparks(fx, t);

  // fade from/to black
  const fade = Math.min(prog(t, 0, .4), 1 - prog(t, DURATION - .6, DURATION));
  $("stage").style.opacity = fade;

  drawGrain(t);
}

window.PROMO = { applyBrand, renderFrame, DURATION, HITS };
</script>
</body>
</html>
